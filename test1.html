<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dyatlov Pass Detective</title>
    <style>
        :root {
            --bg-dark: #121824;
            --panel-bg: #1e2530;
            --accent-blue: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --correct-green: #22c55e;
            --wrong-red: #ef4444;
            --accent-gold: #fbbf24;
            --ccq-bg: #0c141d;
            --ccq-border: #24354a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--panel-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 30px;
            border: 1px solid #2e3748;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2e3748;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stats {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .prompt-card {
            background-color: #111827;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-blue);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .evidence-text {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            color: var(--accent-gold);
            background: rgba(251, 191, 36, 0.1);
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 0.95rem;
            border: 1px solid rgba(251, 191, 36, 0.2);
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-option {
            background: #2d3748;
            color: var(--text-main);
            border: 1px solid #4a5568;
            padding: 14px 18px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 1rem;
            transition: background 0.2s, border-color 0.2s;
            line-height: 1.4;
        }

        .btn-option:hover:not(:disabled) {
            background: #3a4659;
            border-color: var(--accent-blue);
        }

        .btn-option:disabled {
            cursor: default;
        }

        .btn-option.correct {
            background: rgba(34, 197, 94, 0.2) !important;
            border-color: var(--correct-green) !important;
            color: #4ade80;
            font-weight: 600;
        }

        .btn-option.wrong {
            background: rgba(239, 68, 68, 0.2) !important;
            border-color: var(--wrong-red) !important;
            color: #f87171;
        }

        .feedback {
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.95rem;
            line-height: 1.5;
            background: var(--ccq-bg);
            border: 1.5px solid var(--ccq-border);
        }

        .feedback-header {
            font-size: 1.05rem;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #2e3748;
        }

        .ccq-item {
            margin-bottom: 15px;
        }
        
        .ccq-question {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: var(--text-main);
            line-height: 1.5;
        }

        .btn-action {
            width: 100%;
            background: var(--accent-blue);
            color: #0f172a;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: none;
            margin-top: 10px;
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background: #7dd3fc;
        }

        .results-panel {
            text-align: center;
            display: none;
        }

        .score-num {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--accent-gold);
            margin: 15px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="game-panel">
        <div class="header">
            <div class="title">🕵️ Dyatlov Pass Detective</div>
            <div class="stats" id="stats-display">Evidence: 1/7 | Score: 0</div>
        </div>

        <div class="prompt-card">
            <span id="context-text"></span>
            <span id="evidence-text" class="evidence-text"></span>
        </div>

        <div class="options-group" id="options-box"></div>
        
        <div class="feedback" id="feedback-box">
            <div class="feedback-header" id="feedback-header"></div>
            <div class="ccq-item">
                <div class="ccq-question">Explanation:</div>
                <p id="feedback-reason" style="color: var(--text-muted);"></p>
            </div>
        </div>

        <button id="action-button" class="btn-action">Next Evidence →</button>
    </div>

    <div id="results-panel" class="results-panel">
        <div class="title" style="margin-bottom: 10px;">Investigation Complete</div>
        <p>You evaluated all available evidence scenarios.</p>
        <div class="score-num" id="final-score">0 / 7</div>
        <p id="evaluation-text" style="color: var(--text-muted); margin-bottom: 25px;"></p>
        <button id="restart-button" class="btn-action" style="display: block;">Restart Case Review</button>
    </div>
</div>

<script>
    // Original data from Test 1.html
    const q = [
        ['The highly experienced hikers __________ their tent in a state of absolute panic, leaving behind all their survival equipment.', 'The tent was cut open from the inside, and the hikers left their belongings behind.', ['must have fled', 'might have fled', 'must have flee'], 0, 'This is a strong deduction based on the evidence.'],
        ['Some members of the group __________ the tall cedar tree to search for the camp layout in the dark.', 'The cedar tree showed signs of damage, with branches broken up to about five metres high.', ['must have climbed', 'might have climbed', 'might have climb'], 1, 'This is one possible explanation, but we cannot be certain.'],
        ['Naked and without boots in temperatures of 30 degrees below zero, the hikers __________ for very long.', 'The hikers were severely underdressed and the temperature was around –30°C.', ['might have survived', 'must have survived', "can't have survived"], 2, 'The evidence makes long survival almost impossible.'],
        ['The canvas walls of the shelter __________ with a knife from inside rather than outside.', 'Investigators found that the tent had been slashed open from the inside.', ['must have slashed', 'must have been slashed', 'must have been slash'], 1, 'The subject receives the action: must have been + V3.'],
        ['The expedition __________ by outside entities, although no additional footprints were discovered.', 'No additional footprints were discovered, so this remains only a possible explanation.', ['might have been tracked', 'might have tracked', 'must have been track'], 0, 'With limited evidence, this is a possibility.'],
        ['The poorly dressed hikers __________ to death while desperately trying to keep a fire burning by the woods.', 'They were found poorly dressed near the woods, and a fire had apparently been attempted.', ['must have been freezing', 'must have froze', 'might have been freeze'], 0, 'The continuous form presents the action as in progress: must have been + V-ing.'],
        ['They __________ heavy winter jackets when they left the tent, as only light shirts and socks were found on their bodies.', 'Only light shirts, underwear and socks were found; heavy winter clothing was absent.', ['must have been wearing', "can't have been wearing", 'might have been wearing'], 1, 'The evidence strongly suggests they were not wearing heavy jackets.']
    ];

    let index = 0;
    let score = 0;

    const statsEl = document.getElementById('stats-display');
    const contextEl = document.getElementById('context-text');
    const evidenceEl = document.getElementById('evidence-text');
    const optionsBox = document.getElementById('options-box');
    const feedbackBox = document.getElementById('feedback-box');
    const feedbackHeader = document.getElementById('feedback-header');
    const feedbackReason = document.getElementById('feedback-reason');
    const actionBtn = document.getElementById('action-button');
    const gamePanel = document.getElementById('game-panel');
    const resultsPanel = document.getElementById('results-panel');
    const finalScoreEl = document.getElementById('final-score');
    const evalTextEl = document.getElementById('evaluation-text');
    const restartBtn = document.getElementById('restart-button');

    function initQuestion() {
        feedbackBox.style.display = "none";
        actionBtn.style.display = "none";
        optionsBox.innerHTML = "";

        const current = q[index];
        statsEl.textContent = `Evidence: ${index + 1}/${q.length} | Score: ${score}`;
        
        // Build the prompt sentence with the blank
        contextEl.textContent = current[0];
        // Add the evidence text below it
        evidenceEl.textContent = `Evidence: ${current[1]}`;

        current[2].forEach((choice, i) => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.textContent = String.fromCharCode(65 + i) + ') ' + choice;
            btn.addEventListener('click', () => verifySelection(i, btn));
            optionsBox.appendChild(btn);
        });
    }

    function verifySelection(chosenIdx, clickedBtn) {
        const current = q[index];
        const allButtons = optionsBox.querySelectorAll('.btn-option');
        const correctIdx = current[3];
        
        allButtons.forEach(btn => btn.disabled = true);

        if (chosenIdx === correctIdx) {
            clickedBtn.classList.add('correct');
            score++;
            feedbackHeader.textContent = "✅ Correct deduction!";
            feedbackHeader.style.color = "var(--correct-green)";
            feedbackReason.textContent = current[4];
        } else {
            clickedBtn.classList.add('wrong');
            allButtons[correctIdx].classList.add('correct');
            feedbackHeader.textContent = "❌ Incorrect interpretation.";
            feedbackHeader.style.color = "var(--wrong-red)";
            feedbackReason.textContent = current[4];
        }

        statsEl.textContent = `Evidence: ${index + 1}/${q.length} | Score: ${score}`;
        feedbackBox.style.display = "block";
        actionBtn.style.display = "block";
    }

    actionBtn.addEventListener('click', () => {
        index++;
        if (index < q.length) {
            initQuestion();
        } else {
            gamePanel.style.display = "none";
            resultsPanel.style.display = "block";
            finalScoreEl.textContent = `${score} / ${q.length}`;
            
            if (score === q.length) {
                evalTextEl.textContent = "Perfect! You accurately decoded every shade of certainty and modal logic.";
            } else if (score >= 4) {
                evalTextEl.textContent = "Good work. You correctly identified the majority of past modal meanings.";
            } else {
                evalTextEl.textContent = "Keep practicing to master the difference between certainties (must/can't) and possibilities (might).";
            }
        }
    });

    restartBtn.addEventListener('click', () => {
        index = 0;
        score = 0;
        resultsPanel.style.display = "none";
        gamePanel.style.display = "block";
        initQuestion();
    });

    // Start the game
    initQuestion();
</script>

</body>
</html>
