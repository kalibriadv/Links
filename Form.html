<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Dyatlov Pass Files — Form Production Drill</title>
<style>
  :root {
    --bg-dark: #121824;
    --panel-bg: #1e2530;
    --accent-blue: #38bdf8;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --correct-green: #22c55e;
    --wrong-red: #ef4444;
    --accent-gold: #fbbf24;
    --evidence-bg: #0f1a24;
    --evidence-border: #7fb2e5;
    --evidence-text: #7dd3fc;
    --slot-bg: #0c141d;
    --slot-border: #24354a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .game {
    width: 100%;
    max-width: 950px;
    background: var(--panel-bg);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    padding: 30px;
    border: 1px solid #2e3748;
    position: relative;
  }

  /* ---------- HUD ---------- */
  .hud {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #2e3748;
    padding-bottom: 15px;
    margin-bottom: 20px;
  }
  .brand {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--accent-blue);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .stats {
    display: flex;
    gap: 18px;
    font-size: 0.9rem;
    color: var(--text-muted);
    font-weight: 500;
  }
  .stats b { color: var(--text-main); }
  .lamps { display: flex; gap: 4px; align-items: center; }
  .lamp { width: 9px; height: 9px; border-radius: 50%; background: #243244; transition: .3s; }
  .lamp.on { background: var(--accent-gold); box-shadow: 0 0 9px rgba(251, 191, 36, .9); }

  .progress { height: 3px; background: #131c26; margin-bottom: 25px; border-radius: 2px; }
  .progress .fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #3f6d99, var(--accent-blue), #7dd3fc);
    box-shadow: 0 0 14px rgba(56, 189, 248, .7);
    transition: width .45s cubic-bezier(.4,0,.2,1);
    border-radius: 2px;
  }

  /* ---------- SCREENS ---------- */
  .screen { display: none; }
  .screen.show { display: block; animation: pop .35s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* ---------- END ---------- */
  .end { padding: 20px; text-align: center; }
  .end h1 { font-size: 1.6rem; color: #7dd3fc; margin-bottom: 12px; font-weight: 600; }
  .kicker {
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 20px;
  }
  .end p { color: #a9b8c9; line-height: 1.7; max-width: 60ch; margin: 0 auto 14px; font-size: 0.96rem; }

  /* ---------- EVIDENCE CARD ---------- */
  .evidence-card {
    background-color: var(--evidence-bg);
    border: 2px solid var(--evidence-border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 25px;
    box-shadow: 0 0 20px rgba(127, 178, 229, 0.15);
    position: relative;
  }
  .evidence-header {
    display: inline-block;
    background-color: var(--evidence-border);
    color: #0a141f;
    padding: 8px 15px;
    border-radius: 6px;
    font-weight: bold;
    text-transform: uppercase;
    font-size: 0.85rem;
    letter-spacing: 1px;
    margin-top: -35px;
    margin-bottom: 15px;
  }
  .evidence-context {
    font-size: 1.02rem;
    line-height: 1.6;
    color: var(--evidence-text);
    margin-bottom: 15px;
    font-style: italic;
  }
  .sentence {
    font-size: 1.08rem;
    line-height: 1.9;
    color: #f8fafc;
    background: #0a141d;
    padding: 15px;
    border-radius: 6px;
    border: 1px dashed rgba(127, 178, 229, 0.4);
    font-family: 'Courier New', Courier, monospace;
  }
  .sentence .fixed { color: #94a3b8; }
  .sentence .modal { color: var(--accent-gold); font-weight: bold; }
  .slot-marker {
    display: inline-block;
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.8rem;
    color: #4d5f73;
    border: 1px dashed #2a3a4d;
    border-radius: 5px;
    padding: 1px 7px;
    margin: 0 3px;
    vertical-align: middle;
  }
  .slot-marker.done { color: var(--correct-green); border-color: var(--correct-green); border-style: solid; }

  /* ---------- BUILDER ---------- */
  .builder {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
    margin-bottom: 15px;
  }
  .slot {
    background: var(--slot-bg);
    border: 1.5px dashed var(--slot-border);
    border-radius: 10px;
    padding: 10px;
    transition: border-color 0.2s, background 0.2s;
  }
  .slot.filled { border-style: solid; border-color: #2f4a66; background: #0e1826; }
  .slot.ok { border-color: var(--correct-green); background: rgba(34, 197, 94, 0.07); }
  .slot.err { border-color: var(--wrong-red); background: rgba(239, 68, 68, 0.07); }

  .slot-head { margin-bottom: 8px; }
  .slot-name {
    display: block;
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent-blue);
    margin-bottom: 3px;
  }
  .slot-def { display: block; font-size: 0.65rem; color: var(--text-muted); line-height: 1.3; }

  .chips { display: flex; flex-direction: column; gap: 5px; }
  .chip {
    display: flex;
    flex-direction: column;
    gap: 2px;
    width: 100%;
    text-align: left;
    padding: 6px 8px;
    background: #2d3748;
    border: 1.5px solid #4a5568;
    border-radius: 6px;
    cursor: pointer;
    color: var(--text-main);
    transition: border-color 0.15s, background 0.15s, transform 0.12s;
    font-family: inherit;
  }
  .chip:hover:not(:disabled) { border-color: var(--accent-blue); background: #3a4659; transform: translateX(3px); }
  .chip:disabled { cursor: not-allowed; }
  .chip .c-form {
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.9rem;
    color: #f1c40f;
    font-weight: bold;
  }
  .chip .c-def { font-size: 0.6rem; color: var(--text-muted); line-height: 1.2; }
  .chip.sel {
    border-color: var(--accent-gold);
    background: rgba(251, 191, 36, 0.1);
    box-shadow: 0 0 0 1px rgba(251, 191, 36, 0.3) inset;
  }
  .chip.sel .c-form { color: var(--accent-gold); }
  .chip.key-ok { border-color: var(--correct-green); background: rgba(34, 197, 94, 0.15); }
  .chip.key-ok .c-form { color: var(--correct-green); }
  .chip.dim { opacity: 0.3; }

  /* ---------- PREVIEW ---------- */
  .preview {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 12px 15px;
    margin: 15px 0;
    background: #0a1119;
    border: 1px solid #1a2532;
    border-radius: 8px;
  }
  .preview .pv-label {
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-right: 6px;
  }
  .pv-part {
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.9rem;
    color: var(--accent-blue);
    padding: 3px 8px;
    border-radius: 6px;
    background: #111c28;
    border: 1px solid #1e2b3a;
  }
  .pv-part.empty { color: #3d4d5e; border-style: dashed; background: transparent; }
  .pv-part.given { color: var(--accent-gold); border-color: #4a3b1a; background: #1a1408; }

  /* ---------- FEEDBACK ---------- */
  .feedback {
    display: none;
    margin-top: 15px;
    padding: 15px 18px;
    border-radius: 8px;
    border: 1px solid;
    font-size: 0.95rem;
    line-height: 1.6;
  }
  .feedback.show { display: block; }
  .feedback.good { border-color: rgba(34, 197, 94, 0.5); background: rgba(34, 197, 94, 0.07); }
  .feedback.bad { border-color: rgba(239, 68, 68, 0.5); background: rgba(239, 68, 68, 0.07); }
  .feedback .verdict {
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: bold;
    display: block;
    margin-bottom: 10px;
  }
  .feedback.good .verdict { color: var(--correct-green); }
  .feedback.bad .verdict { color: var(--wrong-red); }
  .feedback ul { margin: 8px 0 0 18px; padding: 0; }
  .feedback li { margin-bottom: 12px; }
  .feedback li:last-child { margin-bottom: 0; }
  .feedback .slot-tag {
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent-gold);
  }
  .feedback .formula {
    display: block;
    margin-top: 15px;
    padding-top: 12px;
    border-top: 1px dashed #22303f;
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.9rem;
    color: var(--accent-gold);
  }

  /* ---------- PANELS ---------- */
  .panel {
    display: none;
    margin-top: 20px;
    padding: 15px;
    background: var(--slot-bg);
    border: 1.5px solid var(--slot-border);
    border-radius: 10px;
  }
  .panel.show { display: block; animation: pop 0.35s ease; }

  .p-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 10px 14px;
    margin-bottom: 12px;
  }
  .p-tag {
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.75rem;
    font-weight: bold;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent-blue);
  }
  .p-hint {
    font-size: 0.8rem;
    color: var(--text-muted);
    line-height: 1.5;
    font-style: italic;
  }
  .p-task {
    font-size: 0.88rem;
    color: var(--text-muted);
    margin-bottom: 14px;
    font-style: italic;
  }

  .p-opts { display: flex; flex-direction: column; gap: 8px; }
  .p-opt {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    width: 100%;
    padding: 10px 12px;
    text-align: left;
    background: #2d3748;
    border: 1.5px solid #4a5568;
    border-radius: 8px;
    color: var(--text-main);
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.92rem;
    line-height: 1.5;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.12s;
  }
  .p-opt:hover:not(:disabled) { border-color: var(--accent-blue); background: #3a4659; transform: translateX(3px); }
  .p-opt:disabled { cursor: not-allowed; }
  .p-opt .p-key {
    flex: 0 0 26px;
    height: 26px;
    display: grid;
    place-items: center;
    border-radius: 6px;
    background: #0a1119;
    border: 1px solid #2a3a4d;
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.7rem;
    color: var(--text-muted);
    margin-top: 1px;
    font-weight: bold;
  }
  .p-opt.correct { border-color: var(--correct-green); background: rgba(34, 197, 94, 0.12); transform: translateX(3px); }
  .p-opt.correct .p-key { background: var(--correct-green); color: #06140c; border-color: var(--correct-green); }
  .p-opt.wrong { border-color: var(--wrong-red); background: rgba(239, 68, 68, 0.1); opacity: 0.55; text-decoration: line-through; text-decoration-color: rgba(239, 68, 68, 0.5); }
  .p-opt.wrong .p-key { background: var(--wrong-red); color: #1a0509; border-color: var(--wrong-red); }

  .p-opt.name-opt .p-name {
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.9rem;
    letter-spacing: 0.03em;
  }

  /* ---------- FOOTER ---------- */
  .footer {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 25px;
  }
  .btn-action {
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: bold;
    padding: 14px 24px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(135deg, var(--accent-blue), #7dd3fc);
    color: #0f172a;
    cursor: pointer;
    transition: 0.2s;
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
  }
  .btn-action:hover { box-shadow: 0 0 30px rgba(56, 189, 248, 0.5); }
  .btn-action:disabled { background: #1a2634; color: #4d5f73; box-shadow: none; cursor: not-allowed; }

  .shake { animation: shake 0.4s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  .rank {
    font-family: 'Courier New', Courier, monospace;
    font-size: 1.25rem;
    letter-spacing: 0.08em;
    color: var(--accent-gold);
    margin: 10px 0 16px;
  }
  .end .tally {
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-bottom: 24px;
  }
</style>
</head>
<body>

<div class="game">
  <header class="hud">
    <div class="brand">❄ DYATLOV PASS FILES</div>
    <div class="stats">
      <span>Evidence <b id="stageNum">1</b>/8</span>
      <span>Score <b id="score">0</b></span>
      <span class="lamps" id="lamps"></span>
    </div>
  </header>
  <div class="progress"><div class="fill" id="progFill"></div></div>

  <!-- ================= PLAY ================= -->
  <section class="screen show" id="screenPlay">
    <!-- EVIDENCE CARD -->
    <div class="evidence-card">
      <div class="evidence-header" id="fileLabel">EVIDENCE 01 · THE TENT</div>
      <div class="evidence-context" id="sceneText"></div>
      <div class="sentence" id="sentenceText"></div>
    </div>

    <!-- BUILDER GRID -->
    <div class="builder" id="builder"></div>

    <!-- PREVIEW -->
    <div class="preview">
      <span class="pv-label">Your build</span>
      <span id="previewParts"></span>
    </div>

    <!-- FEEDBACK -->
    <div class="feedback" id="feedback"></div>

    <!-- PHASE B: NAME THE FORM -->
    <div class="panel" id="labelPanel">
      <div class="p-head">
        <span class="p-tag">TASK 2 · NAME THE FORM</span>
        <span class="p-hint">Which of the four forms have you just built?</span>
      </div>
      <div class="p-task">Select the correct grammatical label.</div>
      <div class="p-opts" id="labelOpts"></div>
      <div class="feedback" id="labelFeedback"></div>
    </div>

    <!-- PHASE C: CHOOSE THE CORRECT QUESTION -->
    <div class="panel" id="qPanel">
      <div class="p-head">
        <span class="p-tag">TASK 3 · CHOOSE THE CORRECT QUESTION</span>
      </div>
      <div class="p-opts" id="qOpts"></div>
      <div class="feedback" id="qFeedback"></div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
      <button class="btn-action" id="checkBtn">Check Build</button>
      <button class="btn-action" id="nextBtn" style="display:none">Next Evidence ▶</button>
    </div>
  </section>

  <!-- ================= END ================= -->
  <section class="screen end" id="screenEnd">
    <div class="kicker" id="endKicker">File Complete</div>
    <h1 id="endTitle">All Evidence Logged</h1>
    <div class="rank" id="rankText">—</div>
    <div class="tally" id="tallyText"></div>
    <p id="endText"></p>
    <button class="btn-action" id="retryBtn">Reopen the File</button>
  </section>
</div>

<script>
/* =========================================================
   THE FOUR FORMS
     ACTIVE   · PERFECT SIMPLE      modal + have + V3
     PASSIVE  · PERFECT SIMPLE      modal + have been + V3
     ACTIVE   · PERFECT CONTINUOUS  modal + have been + V-ing
     PASSIVE  · PERFECT CONTINUOUS  modal + have been being + V3
   ========================================================= */

const LABELS = [
  "ACTIVE · PERFECT SIMPLE",
  "PASSIVE · PERFECT SIMPLE",
  "ACTIVE · PERFECT CONTINUOUS",
  "PASSIVE · PERFECT CONTINUOUS"
];

const STAGES = [
  {
    file: "EVIDENCE 01 · THE TENT",
    scene: "The tent was found in scrambles, covered by a thin coat of snow. The hikers' belongings were still orderly placed inside, but the tent itself had been slashed open with a knife from the inside. Nine pairs of footprints led down the slope towards the nearby woods.",
    subject: "The hikers",
    modal: "must",
    tail: "from the tent into the night.",
    verbs: { v1: "flee", v3: "fled", ving: "fleeing" },
    build: { polarity: "none", aux: "have", voice: "none", verb: "v3" },
    label: "ACTIVE · PERFECT SIMPLE",
    question: {
      answer: "Must the hikers have fled from the tent into the night?",
      options: [
        "Must the hikers have fled from the tent into the night?",
        "Do the hikers must have fled from the tent into the night?",
        "Have the hikers must fled from the tent into the night?",
        "Must have the hikers fled from the tent into the night?"
      ],
      wrong: {
        "Do the hikers must have fled from the tent into the night?": "<b>DO-support cannot co-occur with a modal.</b> When a modal is present, the modal itself is the operator — <i>do</i> never appears.",
        "Have the hikers must fled from the tent into the night?": "<b>HAVE is not the operator.</b> The operator is <i>must</i>, so <i>must</i> fronts and <i>have</i> stays inside the verb phrase.",
        "Must have the hikers fled from the tent into the night?": "<b>Only the operator moves.</b> HAVE must remain <i>after</i> the subject."
      }
    }
  },
  {
    file: "EVIDENCE 02 · THE CEDAR",
    scene: "The cedar tree at the edge of the woods showed signs of damage, as if someone had climbed it — branches were broken off up to five metres above the ground.",
    subject: "Someone",
    modal: "might",
    tail: "the cedar to look for the tent.",
    verbs: { v1: "climb", v3: "climbed", ving: "climbing" },
    build: { polarity: "none", aux: "have", voice: "none", verb: "v3" },
    label: "ACTIVE · PERFECT SIMPLE",
    question: {
      answer: "Why might someone have climbed the cedar to look for the tent?",
      options: [
        "Why might someone have climbed the cedar to look for the tent?",
        "Why someone might have climbed the cedar to look for the tent?",
        "Why might have someone climbed the cedar to look for the tent?",
        "Why did someone might have climbed the cedar to look for the tent?"
      ],
      wrong: {
        "Why someone might have climbed the cedar to look for the tent?": "<b>No inversion.</b> The wh-phrase does not replace the subject — the modal must still move in front of it.",
        "Why might have someone climbed the cedar to look for the tent?": "<b>HAVE cannot cross the subject.</b> The order is modal + subject + have + V3.",
        "Why did someone might have climbed the cedar to look for the tent?": "<b>DO-support cannot co-occur with a modal.</b> Two operators cannot share one clause."
      }
    }
  },
  {
    file: "EVIDENCE 03 · THE CLOTHING",
    scene: "The first two bodies were found severely underdressed — no jackets, no pants, no gloves, hats or boots. Only light shirts, underpants and socks. At the time of their death it would have been around 30 degrees below zero.",
    subject: "In those clothes, they",
    modal: "can",
    tail: "the night.",
    verbs: { v1: "survive", v3: "survived", ving: "surviving" },
    build: { polarity: "not", aux: "have", voice: "none", verb: "v3" },
    label: "ACTIVE · PERFECT SIMPLE",
    question: {
      answer: "They can't have survived the night in those clothes, can they?",
      options: [
        "They can't have survived the night in those clothes, can they?",
        "They can't have survived the night in those clothes, can't they?",
        "They can't have survived the night in those clothes, don't they?",
        "They can't have survived the night in those clothes, have they?"
      ],
      wrong: {
        "They can't have survived the night in those clothes, can't they?": "<b>Wrong polarity.</b> The main clause is already negative, so the tag must be affirmative — <i>can they</i>.",
        "They can't have survived the night in those clothes, don't they?": "<b>DO is not the operator.</b> When a modal is present, the tag copies the modal.",
        "They can't have survived the night in those clothes, have they?": "<b>HAVE is not the operator.</b> It sits inside the verb phrase, so it cannot appear in the tag."
      }
    }
  },
  {
    file: "EVIDENCE 04 · THE TENT WALL",
    scene: "The tent itself had been slashed open with a knife from the inside. The cut was deliberate — yet the hikers' belongings and equipment were found orderly placed within.",
    subject: "The tent",
    modal: "must",
    tail: "from the inside with a knife.",
    verbs: { v1: "slash", v3: "slashed", ving: "slashing" },
    build: { polarity: "none", aux: "have", voice: "been", verb: "v3" },
    label: "PASSIVE · PERFECT SIMPLE",
    question: {
      answer: "Must the tent have been slashed from the inside with a knife?",
      options: [
        "Must the tent have been slashed from the inside with a knife?",
        "Must have the tent been slashed from the inside with a knife?",
        "Did the tent must have been slashed from the inside with a knife?",
        "Must the tent been have slashed from the inside with a knife?"
      ],
      wrong: {
        "Must have the tent been slashed from the inside with a knife?": "<b>HAVE must not cross the subject.</b> Only the modal fronts; <i>have been</i> stays behind.",
        "Did the tent must have been slashed from the inside with a knife?": "<b>DO-support cannot co-occur with a modal.</b>",
        "Must the tent been have slashed from the inside with a knife?": "<b>The internal order is fixed:</b> <i>have + been + V3</i>. It never reverses."
      }
    }
  },
  {
    file: "EVIDENCE 05 · THE FOOTPRINTS",
    scene: "Nine pairs of footprints led the search volunteers down the slope towards the nearby woods. The trail was clear in the snow — someone had been following the group's tracks.",
    subject: "The group",
    modal: "might",

/* ---------- SLOT DEFINITIONS ---------- */
function buildSlots(s){
  return [
    {
      name: "SLOT 1 · POLARITY",
      def: "the negative particle, or nothing",
      opts: [
        { id:"none", form:"∅",   def:"affirmative — no negative particle" },
        { id:"not",  form:"not", def:"negative particle" }
      ]
    },
    {
      name: "SLOT 2 · PERFECT AUXILIARY",
      def: "the auxiliary that carries the perfect",
      opts: [
        { id:"have", form:"have", def:"bare form of HAVE" },
        { id:"has",  form:"has",  def:"3rd person singular present of HAVE" },
        { id:"had",  form:"had",  def:"past-tense form of HAVE" },
        { id:"be",   form:"be",   def:"infinitive of BE" },
        { id:"none", form:"∅",    def:"no auxiliary" }
      ]
    },
    {
      name: "SLOT 3 · VOICE · ASPECT MARKER",
      def: "the marker that builds passive and/or progressive",
      opts: [
        { id:"none",       form:"∅",          def:"no marker" },
        { id:"been",       form:"been",       def:"past participle of BE" },
        { id:"being",      form:"being",      def:"present participle of BE" },
        { id:"been being", form:"been being", def:"past participle + present participle of BE" }
      ]
    },
    {
      name: "SLOT 4 · LEXICAL VERB",
      def: "the main verb — form determined by what precedes it",
      opts: [
        { id:"v1",   form:s.verbs.v1,   def:"V1 · base form" },
        { id:"v3",   form:s.verbs.v3,   def:"V3 · past participle" },
        { id:"ving", form:s.verbs.ving, def:"V-ing · present participle" }
      ]
    }
  ];
}

/* ---------- SLOT ERROR EXPLANATIONS ---------- */
function explainSlot(slotIndex, chosenId, s){
  const t = s.build;

  if (slotIndex === 0){
    if (chosenId === "not" && t.polarity === "none")
      return "You inserted the negative particle <b>not</b>. Nothing in the evidence denies the action — the target phrase is <b>affirmative</b>, so the polarity slot stays empty (∅).";
    if (chosenId === "none" && t.polarity === "not")
      return "You left the polarity slot empty. The evidence <b>denies</b> the action, so the verb phrase must carry the negative particle <b>not</b>.";
    return "Incorrect polarity.";
  }

  if (slotIndex === 1){
    switch (chosenId){
      case "has":
        return "<b>has</b> is the 3rd-person-singular <i>present</i> form of HAVE. A modal cannot be followed by a tensed form — the perfect auxiliary after a modal is always the bare form <b>have</b>.";
      case "had":
        return "<b>had</b> is the <i>past-tense</i> form of HAVE. Tense is carried by the modal itself, so the auxiliary must be the bare form <b>have</b>.";
      case "be":
        return "<b>be</b> is the infinitive of BE. It appears after other modals (<i>will be</i>, <i>can be</i>), but the perfect requires the auxiliary <b>have</b>.";
      case "none":
        return "You left the auxiliary slot empty. Every perfect verb phrase requires the auxiliary <b>have</b>; without it the phrase is not perfect at all.";
    }
    return "Incorrect auxiliary.";
  }

  if (slotIndex === 2){
    const target = t.voice;

    if (chosenId === "none"){
      if (target === "been")
        return "You left the voice/aspect slot empty. That produces the <b>ACTIVE PERFECT SIMPLE</b> shape (<i>have + V3</i>). The target requires the marker <b>been</b> in this slot.";
      if (target === "been being")
        return "You left the voice/aspect slot empty. That produces the <b>ACTIVE PERFECT SIMPLE</b> shape. The target requires the compound marker <b>been being</b> — the passive marker <i>been</i> plus the progressive marker <i>being</i>.";
    }

    if (chosenId === "been"){
      if (target === "none")
        return "<b>been</b> is the past participle of BE. Inserting it adds a second participle layer — this yields either the <b>PASSIVE PERFECT SIMPLE</b> (<i>been + V3</i>) or the <b>ACTIVE PERFECT CONTINUOUS</b> (<i>been + V-ing</i>). The target is the plain active perfect simple, so this slot must be empty (∅).";
      if (target === "been being")
        return "<b>been</b> alone yields the <b>PASSIVE PERFECT SIMPLE</b> shape (<i>been + V3</i>). The <b>PASSIVE PERFECT CONTINUOUS</b> requires the compound marker <b>been being</b> — the past participle followed by the present participle of BE.";
    }

    if (chosenId === "being"){
      return "<b>being</b> is the present participle of BE. It follows a form of BE in the progressive passive (<i>is being watched</i>), never HAVE. HAVE requires a past participle, so <b>being</b> cannot stand alone in this slot.";
    }

    if (chosenId === "been being"){
      if (target === "been")
        return "<b>been being</b> adds a progressive layer on top of the passive — that yields the <b>PASSIVE PERFECT CONTINUOUS</b>. The target is the <b>PASSIVE PERFECT SIMPLE</b>, which needs only <b>been</b>.";
      if (target === "none")
        return "<b>been being</b> introduces two participle layers. The target is the plain <b>ACTIVE PERFECT SIMPLE</b>, so this slot must be empty (∅).";
    }
    return "Incorrect voice / aspect marker.";
  }

  if (slotIndex === 3){
    const target = t.verb;
    if (chosenId === "v1")
      return "<b>V1</b> is the base form. Neither HAVE nor BEEN can be followed by a bare base form — the perfect always requires a participle.";
    if (chosenId === "ving" && target === "v3")
      return "<b>V-ing</b> is the present participle. It produces the <b>CONTINUOUS</b> shape. The target is not continuous — it requires the past participle <b>V3</b>.";
    if (chosenId === "v3" && target === "ving")
      return "<b>V3</b> is the past participle. It produces the <b>PASSIVE</b> shape. The target is <b>CONTINUOUS</b>, which requires the present participle <b>V-ing</b>.";
    return "Incorrect lexical verb form.";
  }
  return "";
}

/* ---------- LABEL EXPLANATIONS ---------- */
function labelFeatures(label){
  const parts = label.split(" · ");
  return {
    voice: parts[0],
    aspect: parts[1].includes("CONTINUOUS") ? "CONTINUOUS" : "SIMPLE"
  };
}

function targetFeatures(s){
  const t = s.build;
  const voice = (t.voice !== "none" && t.verb === "v3") ? "PASSIVE" : "ACTIVE";
  const aspect = (t.verb === "ving" || t.voice === "been being") ? "CONTINUOUS" : "SIMPLE";
  return { voice, aspect };
}

function explainLabel(chosenLabel, s){
  const tf = targetFeatures(s);
  const cf = labelFeatures(chosenLabel);
  const parts = [];

  if (cf.voice !== tf.voice){
    if (tf.voice === "PASSIVE")
      parts.push("You labelled the voice <b>ACTIVE</b>. In this sentence the subject is the <b>receiver</b> of the action, not the performer — the voice must be <b>PASSIVE</b>.");
    else
      parts.push("You labelled the voice <b>PASSIVE</b>. In this sentence the subject is the <b>performer</b> of the action, not the receiver — the voice must be <b>ACTIVE</b>.");
  }

  if (cf.aspect !== tf.aspect){
    if (tf.aspect === "CONTINUOUS")
      parts.push("You labelled the aspect <b>SIMPLE</b>. The evidence presents the action as an <b>ongoing state</b> held over a stretch of time — the aspect must be <b>CONTINUOUS</b>.");
    else
      parts.push("You labelled the aspect <b>CONTINUOUS</b>. The evidence presents the action as a <b>completed whole</b>, not as an ongoing process — the aspect must be <b>SIMPLE</b>.");
  }

  if (!parts.length) parts.push("Incorrect label.");
  return parts.join("<br><br>");
}

let lamps = MAX_LAMPS;

/* ================= DOM ================= */

const screenEnd   = document.getElementById("screenEnd");

/* ================= HELPERS ================= */
function shuffle(arr){
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function updateHud(){
  scoreEl.textContent = score;
  stageNumEl.textContent = Math.min(stageIndex + 1, STAGES.length);

  let html = "";
  for (let i = 0; i < MAX_LAMPS; i++){
    html += `<span class="lamp${i < lamps ? " on" : ""}"></span>`;
  }
  lampsEl.innerHTML = html;

  let units = stageIndex * 3;
  if (buildDone)    units += 1;
  if (labelDone)    units += 1;
  if (questionDone) units += 1;
  progFill.style.width = (units / (STAGES.length * 3) * 100) + "%";
}

/* ================= RENDER ================= */
function renderStage(){
  const s = STAGES[stageIndex];

  buildAttempts = 0;
  labelAttempts = 0;
  questionAttempts = 0;
  buildDone = false;
  labelDone = false;
  questionDone = false;
  selection = [null, null, null, null];
  slots = buildSlots(s);

  fileLabel.textContent = s.file;
  sceneText.textContent = s.scene;

  sentenceText.innerHTML =
    `<span class="fixed">${s.subject}</span> ` +
    `<span class="modal">${s.modal}</span> ` +
    `<span class="slot-marker" id="mk0">1</span>` +
    `<span class="slot-marker" id="mk1">2</span>` +
    `<span class="slot-marker" id="mk2">3</span>` +
    `<span class="slot-marker" id="mk3">4</span> ` +
    `<span class="fixed">${s.tail}</span>`;

  builderEl.innerHTML = "";
  builderEl.style.display = "grid";

  slots.forEach((slot, si) => {
    const div = document.createElement("div");
    div.className = "slot";
    div.id = "slot" + si;

    const head = document.createElement("div");
    head.className = "slot-head";
    head.innerHTML =
      `<span class="slot-name">${slot.name}</span>` +
      `<span class="slot-def">${slot.def}</span>`;
    div.appendChild(head);

    const chips = document.createElement("div");
    chips.className = "chips";

    shuffle(slot.opts).forEach(opt => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.dataset.id = opt.id;
      b.dataset.slot = si;
      b.innerHTML =
        `<span class="c-form">${opt.form}</span>` +
        `<span class="c-def">${opt.def}</span>`;
      b.addEventListener("click", () => selectChip(si, opt.id, b));
      chips.appendChild(b);
    });

    div.appendChild(chips);
    builderEl.appendChild(div);
  });

  checkBtn.style.display = "inline-block";
  checkBtn.disabled = false;
  nextBtn.style.display = "none";

  feedbackEl.className = "feedback";
  feedbackEl.innerHTML = "";
  labelPanel.classList.remove("show");
  labelOpts.innerHTML = "";
  labelFeedback.className = "feedback";
  labelFeedback.innerHTML = "";
  qPanel.classList.remove("show");
  qOpts.innerHTML = "";
  qFeedback.className = "feedback";
  qFeedback.innerHTML = "";

  renderPreview();
  updateHud();
}

/* ================= SELECTION ================= */
function selectChip(slotIndex, optId, btn){
  if (buildDone) return;

  selection[slotIndex] = optId;

  const slotEl = document.getElementById("slot" + slotIndex);
  slotEl.querySelectorAll(".chip").forEach(c => c.classList.remove("sel"));
  btn.classList.add("sel");
  slotEl.classList.add("filled");

  const mk = document.getElementById("mk" + slotIndex);
  if (mk) mk.classList.add("done");

  renderPreview();
}

function renderPreview(){
  const s = STAGES[stageIndex];
  const html = [];

  html.push(`<span class="pv-part given">${s.modal}</span>`);

  slots.forEach((slot, si) => {
    const chosen = selection[si];
    if (chosen === null){
      html.push(`<span class="pv-part empty">[ ${slot.name.split("· ")[1]} ]</span>`);
      return;
    }
    if (chosen === "none"){
      html.push(`<span class="pv-part empty">∅</span>`);
    } else {
      const opt = slot.opts.find(o => o.id === chosen);
      html.push(`<span class="pv-part">${opt.form}</span>`);
    }
  });

  previewParts.innerHTML = html.join(" ");
}

/* ================= PHASE A · CHECK BUILD ================= */
checkBtn.addEventListener("click", () => {
  if (buildDone) return;

  const s = STAGES[stageIndex];
  const target = [s.build.polarity, s.build.aux, s.build.voice, s.build.verb];

  if (selection.includes(null)){
    feedbackEl.className = "feedback show bad";
    feedbackEl.innerHTML =
      `<span class="verdict">Incomplete</span>` +
      `Every slot must be filled before the build can be checked.`;
    return;
  }

  const correct = selection.every((v, i) => v === target[i]);

  if (correct){
    buildDone = true;

    slots.forEach((slot, si) => {
      document.getElementById("slot" + si).classList.add("ok");
      const btn = document.querySelector(`#slot${si} .chip[data-id="${selection[si]}"]`);
      if (btn) btn.classList.add("key-ok");
    });

    document.querySelectorAll(".chip").forEach(c => {
      c.disabled = true;
      if (!c.classList.contains("key-ok")) c.classList.add("dim");
    });

    const gain = buildAttempts === 0 ? 150 : buildAttempts === 1 ? 90 : 40;
    score += gain;
    updateHud();

    feedbackEl.className = "feedback show good";
    feedbackEl.innerHTML =
      `<span class="verdict">✓ Verb phrase correct · +${gain} pts</span>` +
      `Slot 1 supplied the polarity, Slot 2 the perfect auxiliary, Slot 3 the voice/aspect marker, ` +
      `and Slot 4 the correct participle form.` +
      `<span class="formula">${s.subject} ${s.modal} ${phraseText(s)} ${s.tail}</span>`;

    checkBtn.style.display = "none";

    setTimeout(() => openLabelPhase(), 420);

  } else {
    buildAttempts++;
    lamps--;
    updateHud();

    const problems = [];

    slots.forEach((slot, si) => {
      const slotEl = document.getElementById("slot" + si);
      const ok = selection[si] === target[si];
      slotEl.classList.remove("ok", "err");
      slotEl.classList.add(ok ? "ok" : "err");

      if (!ok){
        const chosenOpt = slot.opts.find(o => o.id === selection[si]);
        problems.push(
          `<li><span class="slot-tag">Slot ${si + 1} · ${slot.name.split("· ")[1]}</span><br>` +
          `You chose <b>${chosenOpt.form}</b> (${chosenOpt.def}).<br>` +
          `${explainSlot(si, selection[si], s)}</li>`
        );
      }
    });

    feedbackEl.className = "feedback show bad";
    feedbackEl.innerHTML =
      `<span class="verdict">✕ Verb phrase incorrect · −1 lamp</span>` +
      `<ul>${problems.join("")}</ul>`;

    document.querySelector(".game").classList.add("shake");
    setTimeout(() => document.querySelector(".game").classList.remove("shake"), 420);

    if (lamps <= 0) setTimeout(gameOver, 1200);
  }
});

/* ================= PHASE B · NAME THE FORM ================= */
function openLabelPhase(){
  const s = STAGES[stageIndex];
  labelPanel.classList.add("show");

  labelOpts.innerHTML = "";
  shuffle(LABELS).forEach((text, i) => {
    const b = document.createElement("button");
    b.type = "button";

    b.innerHTML = `<span class="p-key">${i + 1}</span><span class="p-name">${text}</span>`;

function chooseLabel(text, btn){
  if (labelDone) return;
  const s = STAGES[stageIndex];

  if (text === s.label){
    labelDone = true;
    btn.classList.add("correct");
    labelOpts.querySelectorAll(".p-opt").forEach(b => b.disabled = true);

    const gain = labelAttempts === 0 ? 100 : 50;
    score += gain;
    updateHud();

    labelFeedback.className = "feedback show good";
    labelFeedback.innerHTML =
      `<span class="verdict">✓ Label correct · +${gain} pts</span>` +
      `You built the <b>${s.label}</b> — the phrase <i>${phraseText(s)}</i> corresponds exactly to that form.`;

    setTimeout(() => openQuestionPhase(), 420);

  } else {
    labelAttempts++;
    lamps--;
    updateHud();

    btn.classList.add("wrong");
    btn.disabled = true;

    labelFeedback.className = "feedback show bad";
    labelFeedback.innerHTML =
      `<span class="verdict">✕ Label incorrect · −1 lamp</span>` +
      `${explainLabel(text, s)}`;

    labelPanel.classList.add("shake");
    setTimeout(() => labelPanel.classList.remove("shake"), 420);

    if (lamps <= 0) setTimeout(gameOver, 1200);
  }
}

/* ================= PHASE C · CHOOSE THE CORRECT QUESTION ================= */
function openQuestionPhase(){
  const s = STAGES[stageIndex];
  const q = s.question;

  qPanel.classList.add("show");

  qOpts.innerHTML = "";
  shuffle(q.options).forEach((text, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "p-opt";
    b.innerHTML = `<span class="p-key">${i + 1}</span><span>${text}</span>`;
    b.addEventListener("click", () => chooseQuestion(text, b));
    qOpts.appendChild(b);
  });

  qFeedback.className = "feedback";
  qFeedback.innerHTML = "";
  qPanel.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function chooseQuestion(text, btn){
  if (questionDone) return;
  const s = STAGES[stageIndex];
  const q = s.question;

  if (text === q.answer){
    questionDone = true;
    btn.classList.add("correct");
    qOpts.querySelectorAll(".p-opt").forEach(b => b.disabled = true);

    const gain = questionAttempts === 0 ? 100 : 50;
    score += gain;
    updateHud();

    qFeedback.className = "feedback show good";
    qFeedback.innerHTML =
      `<span class="verdict">✓ Question correct · +${gain} pts</span>` +
      `<span class="formula">${q.answer}</span>`;

    nextBtn.style.display = "inline-block";
    nextBtn.textContent =
      stageIndex === STAGES.length - 1 ? "Close the File ✔" : "Next Evidence ▶";
    nextBtn.focus();

  } else {
    questionAttempts++;
    lamps--;
    updateHud();

    btn.classList.add("wrong");
    btn.disabled = true;

    const why = q.wrong[text] || "Incorrect question form.";

    qFeedback.className = "feedback show bad";
    qFeedback.innerHTML =
      `<span class="verdict">✕ Question incorrect · −1 lamp</span>` +
      `${why}` +
      `<span class="formula">Target: ${q.answer}</span>`;

    qPanel.classList.add("shake");
    setTimeout(() => qPanel.classList.remove("shake"), 420);

    if (lamps <= 0) setTimeout(gameOver, 1200);
  }
}

/* ---------- helper: display the assembled phrase ---------- */
function phraseText(s){
  const t = s.build;
  const v = s.verbs;
  const neg = t.polarity === "not" ? "not " : "";
  if (t.voice === "none")       return `${neg}have ${v.v3}`;
  if (t.voice === "been")       return t.verb === "ving" ? `${neg}have been ${v.ving}` : `${neg}have been ${v.v3}`;
  if (t.voice === "been being") return `${neg}have been being ${v.v3}`;
  if (t.voice === "being")      return `${neg}have being ${v.v3}`;
  return `${neg}have ${v.v3}`;
}

/* ================= TRANSITIONS ================= */
function startGame(){
  stageIndex = 0;
  score = 0;
  lamps = MAX_LAMPS;
  screenEnd.classList.remove("show");
  screenPlay.classList.add("show");
  renderStage();
}

nextBtn.addEventListener("click", () => {
  if (stageIndex < STAGES.length - 1){
    stageIndex++;
    renderStage();
    window.scrollTo({ top: 0, behavior: "smooth" });
  } else {
    winGame();
  }
});

/* ================= ENDINGS ================= */
function rankFor(points){
  if (points >= 2600) return "SENIOR STRUCTURAL ANALYST";
  if (points >= 2100) return "FIELD ANALYST";
  if (points >= 1600) return "ASSISTANT ANALYST";
  if (points >= 1100) return "JUNIOR ANALYST";
  return "TRAINEE";
}

function winGame(){
  screenPlay.classList.remove("show");
  screenEnd.classList.add("show");

  document.getElementById("endKicker").textContent = "File Complete";
  document.getElementById("endTitle").textContent  = "All Evidence Logged";
  document.getElementById("rankText").textContent  = rankFor(score);
  document.getElementById("tallyText").textContent =
    `${score} points  ·  ${lamps} lamp${lamps === 1 ? "" : "s"} remaining  ·  ${STAGES.length * 3} sub-tasks`;
  document.getElementById("endText").innerHTML =
    "You produced all four forms and all their question shapes:<br><br>" +
    "<b>ACTIVE · PERFECT SIMPLE</b> — <i>have + V3</i><br>" +
    "<b>PASSIVE · PERFECT SIMPLE</b> — <i>have been + V3</i><br>" +
    "<b>ACTIVE · PERFECT CONTINUOUS</b> — <i>have been + V-ing</i><br>" +
    "<b>PASSIVE · PERFECT CONTINUOUS</b> — <i>have been being + V3</i><br><br>" +
    "And every question type: yes/no · wh- · negative · tag · subject — all formed by fronting the modal operator.";

  progFill.style.width = "100%";
  document.getElementById("retryBtn").textContent = "Reopen the File";
}

function gameOver(){
  screenPlay.classList.remove("show");
  screenEnd.classList.add("show");

  document.getElementById("endKicker").textContent = "File Cold";
  document.getElementById("endTitle").textContent  = "Out of Lamps";
  document.getElementById("rankText").textContent  = "INVESTIGATION SUSPENDED";
  document.getElementById("tallyText").textContent = `${score} points  ·  0 lamps remaining`;
  document.getElementById("endText").innerHTML =
    "Rebuild the four forms from their components:<br><br>" +
    "<b>ACTIVE · PERFECT SIMPLE</b> — <i>have + V3</i><br>" +
    "<b>PASSIVE · PERFECT SIMPLE</b> — <i>have been + V3</i><br>" +
    "<b>ACTIVE · PERFECT CONTINUOUS</b> — <i>have been + V-ing</i><br>" +
    "<b>PASSIVE · PERFECT CONTINUOUS</b> — <i>have been being + V3</i><br><br>" +
    "In every question the <b>modal is the operator</b> that fronts.";

  document.getElementById("retryBtn").textContent = "Relight & Retry";
}

/* ================= CONTROLS ================= */
document.getElementById("retryBtn").addEventListener("click", () => {
  screenEnd.classList.remove("show");
  startGame();
});

document.addEventListener("keydown", (e) => {
  if (!screenPlay.classList.contains("show")){
    if (e.key === "Enter"){
      if (screenEnd.classList.contains("show")){
        screenEnd.classList.remove("show");
        startGame();
      }
    }
    return;
  }

  if (e.key >= "1" && e.key <= "5"){
    const idx = parseInt(e.key, 10) - 1;
    if (labelPanel.classList.contains("show") && !labelDone){
      const btns = labelOpts.querySelectorAll(".p-opt:not(:disabled)");
      if (btns[idx]) btns[idx].click();
    } else if (qPanel.classList.contains("show") && !questionDone){
      const btns = qOpts.querySelectorAll(".p-opt:not(:disabled)");
      if (btns[idx]) btns[idx].click();
    }
  }

  if (e.key === "Enter"){
    if (nextBtn.style.display !== "none") nextBtn.click();
    else if (!buildDone) checkBtn.click();
  }
});

/* ---------- INIT ---------- */
startGame();
</script>
